workflows:
  ios-unsigned-ipa:
    name: Build unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      groups:
        - discord   # contains DISCORD_CLIENT_ID and DISCORD_SDK_URL
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Fetch Discord Social SDK (optional)
        script: |
          mkdir -p Frameworks
          if [ -n "$DISCORD_SDK_URL" ]; then
            curl -fL "$DISCORD_SDK_URL" -o sdk.zip
            unzip -q sdk.zip -d sdk_tmp
            found=$(find sdk_tmp -name "*.xcframework" -maxdepth 6 | head -1)
            [ -n "$found" ] && cp -R "$found" Frameworks/
          fi
          ls Frameworks || true

      - name: Generate Xcode project
        script: |
          SPEC=project.yml
          sdk=$(ls -d Frameworks/*.xcframework 2>/dev/null | head -1 || true)
          if [ -n "$sdk" ]; then
            echo "Linking $sdk"
            awk -v fw="$sdk" '{print} /^    sources:/ {print "    dependencies:"; print "      - framework: " fw; print "        embed: true"}' project.yml > project-sdk.yml
            SPEC=project-sdk.yml
          else
            echo "Discord Social SDK not found - building with stubs (no presence)."
          fi
          xcodegen generate --spec "$SPEC"

      - name: Build (unsigned)
        script: |
          xcodebuild -project YTPlusRPC.xcodeproj -scheme YTPlusRPC \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        script: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/YTPlusRPC.app Payload/
          zip -qry YTPlusRPC.ipa Payload

    artifacts:
      - YTPlusRPC.ipa
