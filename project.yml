name: YTPlusRPC
options:
  bundleIdPrefix: com.ytplusrpc
  deploymentTarget:
    iOS: "16.0"
targets:
  YTPlusRPC:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ytplusrpc.app
        PRODUCT_NAME: YTPlusRPC
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/YTPlusRPC-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        OTHER_LDFLAGS: "-ObjC"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: YouTube Plus RPC
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: "Receives now-playing updates from YouTube Plus on this network."
        DiscordClientID: "${DISCORD_CLIENT_ID}"
        CFBundleURLTypes:
          - CFBundleURLName: discord-oauth
            CFBundleURLSchemes: ["discord-${DISCORD_CLIENT_ID}"]
